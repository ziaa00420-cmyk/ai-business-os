[project]
name = "aibos-api"
version = "0.1.0"
description = "AI Business OS API: onboarding, business profile, catalogue import"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",
    "anthropic>=0.70",
    "pypdf>=4.2",
    "openpyxl>=3.1",
    "pyjwt[crypto]>=2.8",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501", "UP047"]  # long lines are prompt text; the formatter handles code

[tool.pytest.ini_options]
testpaths = ["tests"]
